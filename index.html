<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>入党积极分子 · 党校刷题</title>
<style>
:root{
  --red:#b3222c; --red-d:#8d1620; --red-l:#d94a52;
  --gold:#c9a24d; --gold-l:#e8cf94;
  --ink:#2a211c; --ink-2:#6b5f57; --line:#e8ddd2;
  --bg:#fbf6f0; --card:#fffdfa; --ok:#2f7d5f; --bad:#b3222c;
  --shadow:0 2px 18px rgba(120,70,40,.09);
}
body.night{
  --ink:#f0e6dc; --ink-2:#b3a396; --line:#41322c;
  --bg:#1a1310; --card:#241a16; --ok:#5cc194; --bad:#ef7a74;
  --red:#c23940; --red-d:#93212a; --red-l:#e06b70; --gold:#d0ab5e; --gold-l:#e8cf94;
  --shadow:0 2px 20px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body.night{color-scheme:dark}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  font-size:16px;line-height:1.6;padding-bottom:34px;
}
.wrap{max-width:760px;margin:0 auto;padding:14px}
/* ---------- header ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:20px;
  background:linear-gradient(135deg,var(--red-d) 0%,var(--red) 46%,#a01f29 100%);
  color:#fff;padding:20px 20px 18px;box-shadow:0 8px 26px rgba(140,30,35,.28);
}
.hero::after{
  content:"";position:absolute;right:-40px;top:-56px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(255,215,140,.34),rgba(255,215,140,0) 68%);
  pointer-events:none;
}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:relative;z-index:1}
.badge{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.14em;
  color:var(--gold-l);border:1px solid rgba(232,207,148,.55);border-radius:999px;padding:3px 11px;
}
.hero h1{margin:9px 0 3px;font-size:25px;letter-spacing:.03em;font-weight:700}
.hero p{margin:0;font-size:13px;color:rgba(255,255,255,.8)}
.mini{
  border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.14);color:#fff;
  border-radius:11px;padding:7px 11px;font-size:13px;white-space:nowrap;cursor:pointer;
  font-family:inherit;flex-shrink:0
}
.mini:active{transform:scale(.97)}
/* ---------- tabs ---------- */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0}
.tab{
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);border-radius:13px;
  padding:9px 2px;font-size:14px;font-family:inherit;cursor:pointer;transition:.16s;line-height:1.35
}
.tab b{display:block;font-size:15px;color:var(--ink);font-weight:600}
.tab span{font-size:11px;opacity:.72}
.tab.on{border-color:var(--red);background:var(--red);color:#fff;box-shadow:0 4px 14px rgba(179,34,44,.24)}
.tab.on b,.tab.on span{color:#fff}
/* ---------- panel ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:2px 0 4px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:11px 4px;text-align:center}
.stat b{display:block;font-size:23px;line-height:1.2;color:var(--red)}
.stat small{font-size:11px;color:var(--ink-2)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
.btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;
  padding:10px 14px;font-family:inherit;font-size:14.5px;cursor:pointer;transition:.14s
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.gold{background:linear-gradient(135deg,#d8b25f,#c39a41);border-color:#c39a41;color:#3a2a12;font-weight:600}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:12.5px;color:var(--ink-2);line-height:1.65}
/* ---------- question ---------- */
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:11px}
.chip{font-size:12px;background:var(--bg);border:1px solid var(--line);color:var(--ink-2);border-radius:999px;padding:3px 10px}
.qtext{font-size:18px;line-height:1.85;letter-spacing:.01em;margin:4px 0 15px;white-space:pre-wrap;word-break:break-word}
.qtext em{font-style:normal;color:var(--red);font-weight:600}
.opt{
  display:block;width:100%;text-align:left;margin:9px 0;padding:13px 14px;font-size:15.5px;line-height:1.65;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;
  font-family:inherit;cursor:pointer;transition:.15s
}
.opt .k{display:inline-block;min-width:22px;font-weight:700;color:var(--gold);margin-right:5px}
.opt.sel{border-color:var(--red);background:rgba(179,34,44,.07)}
.opt.good{border-color:var(--ok);background:rgba(47,125,95,.1)}
.opt.bad{border-color:var(--bad);background:rgba(179,34,44,.1)}
.opt.good .k{color:var(--ok)}
.opt:disabled{cursor:default}
/* fill answer card */
.answerbox{border:1px dashed var(--line);border-radius:14px;padding:13px 14px;background:var(--bg);margin:6px 0 13px;line-height:2}
.blank{display:inline-block;min-width:74px;border-bottom:2px solid var(--gold);color:var(--red);font-weight:600;text-align:center;padding:0 8px;margin:0 2px}
.blank.hide{color:transparent;border-bottom-color:var(--gold);background:transparent}
.blankrow{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:9px 16px;font-size:15px}
.blankitem{display:inline-flex;align-items:baseline;gap:5px;color:var(--ink-2)}
.verdict{border-radius:13px;padding:12px 14px;margin:11px 0;font-size:14.5px;line-height:1.7}
.verdict.ok{background:rgba(47,125,95,.11);border:1px solid rgba(47,125,95,.34);color:var(--ok)}
.verdict.bad{background:rgba(179,34,44,.09);border:1px solid rgba(179,34,44,.3);color:var(--bad)}
.verdict .k{font-weight:700}
.navrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.navrow .grow{flex:1}
.jump{display:flex;gap:7px;align-items:center;margin-top:13px;font-size:13.5px;color:var(--ink-2);flex-wrap:wrap}
.jump input{
  width:76px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:var(--ink);font-family:inherit;font-size:14.5px
}
/* list / wrongbook */
.rowitem{padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.7}
.rowitem:last-child{border-bottom:0}
.rowitem .t{color:var(--ink)}
.meta{font-size:12.5px;color:var(--ink-2);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{background:rgba(179,34,44,.1);color:var(--red);border-radius:999px;padding:1px 9px;font-size:12px}
.pill.ok{background:rgba(47,125,95,.13);color:var(--ok)}
.sel-wrap{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 2px}
/* misc */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
h2.s{font-size:16px;margin:0 0 10px;letter-spacing:.02em}
.divider{height:1px;background:var(--line);margin:13px 0}
.foot{text-align:center;font-size:12px;color:var(--ink-2);line-height:1.8;padding:6px 4px 0}
.empty{text-align:center;color:var(--ink-2);padding:26px 8px;font-size:14.5px}
@media (max-width:420px){
  .tabs{grid-template-columns:repeat(3,1fr)}
  .hero h1{font-size:22px}
  .qtext{font-size:17px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-top">
      <div>
        <span class="badge">电气学院分党校</span>
        <h1>入党积极分子 · 刷题</h1>
        <p>填空题 · 单选题 · 多选题 · 判断题　共 <b id="totalNum">0</b> 题</p>
      </div>
      <button class="mini" id="themeBtn" type="button" onclick="toggleTheme()">🌙 夜间</button>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <section class="panel" id="homePane">
    <div class="stats" id="stats"></div>
    <div class="divider"></div>
    <h2 class="s">开始刷题</h2>
    <div class="toolbar">
      <button class="btn primary" onclick="Study.start('order')">顺序刷题</button>
      <button class="btn" onclick="Study.start('random')">随机刷题</button>
      <button class="btn" onclick="Study.start('wrong')">只刷错题</button>
      <button class="btn gold" onclick="Exam.begin()">模拟考试</button>
    </div>
    <div class="divider"></div>
    <h2 class="s">学习工具</h2>
    <div class="toolbar">
      <button class="btn" onclick="UI.wrongBook()">📕 错题本</button>
      <button class="btn" onclick="UI.exportData()">导出记录</button>
      <button class="btn" onclick="document.getElementById('importFile').click()">导入记录</button>
      <button class="btn ghost" onclick="UI.resetAll()">清空记录</button>
      <input id="importFile" type="file" accept="application/json" hidden>
    </div>
    <p class="hint" style="margin:12px 0 0">
      记录保存在当前浏览器（localStorage），换设备或清缓存会丢失，建议定期导出备份。
      填空题点“查看答案”后自己判断对错；多选设 <b>不确定 / 多选少选</b> 项可以按考试规则给分。
    </p>
  </section>

  <section class="panel" id="mainPane" hidden></section>

  <p class="foot">
    题库整理自《电气学院分党校积极分子》培训资料<br>
    答案以原文件为准，如发现错漏请以党校教材为最终依据
  </p>
</div>

<script>

const TYPE_LABEL = {fill:"填空题", single:"单选题", multi:"多选题", judge:"判断题", quiz:"练习提升"};
const TYPE_SHORT = {fill:"填空", single:"单选", multi:"多选", judge:"判断", quiz:"练习"};
const KEYS = ["fill","single","multi","judge","quiz"];
const LS = "rudang_quiz_v1";

/* ---------------- storage ---------------- */
let store = {db:{}, cursor:{}, unlocked:{}, theme:"day"};
try{
  const raw = JSON.parse(localStorage.getItem(LS) || "null");
  if(raw && typeof raw === "object"){
    store.db = raw.db || {};
    store.cursor = raw.cursor || {};
    store.unlocked = raw.unlocked || {};
    store.theme = raw.theme === "night" ? "night" : "day";
  }
}catch(e){}
function persist(){
  try{ localStorage.setItem(LS, JSON.stringify(store)); }catch(e){}
}
function rec(id){
  return store.db[id] || (store.db[id] = {a:0, w:0, c:0, master:false});
}

/* ---------------- current bank ---------------- */
const UI = {};
let curBank = "fill";

function bankList(){ return BANKS[curBank] || []; }
function byId(id){
  for(const k of KEYS){
    const list = BANKS[k] || [];
    for(const q of list){ if(qId(q) === id) return q; }
  }
  return null;
}
function qId(q){ return q.t + "-" + q.n; }

/* ---------------- tabs & stats ---------------- */
function renderTabs(){
  document.getElementById("tabs").innerHTML = KEYS.map(k =>
    `<button class="tab ${k===curBank?'on':''}" onclick="UI.switchBank('${k}')">
       <b>${TYPE_LABEL[k]}</b><span>${(BANKS[k]||[]).length} 题</span>
     </button>`).join("");
  document.getElementById("totalNum").textContent = KEYS.reduce((s,k)=>s+(BANKS[k]||[]).length, 0);
}
UI.switchBank = function(k){
  curBank = k;
  Study.mode = null;
  renderTabs();
  UI.home();
  window.scrollTo({top:0, behavior:"smooth"});
};

function renderStats(){
  const all = Object.entries(store.db);
  const attempts = all.reduce((s,[,v])=>s+v.a,0);
  const correct = all.reduce((s,[,v])=>s+v.c,0);
  const wrongN = all.filter(([,v])=>v.w>0 && !v.master).length;
  const done = all.filter(([,v])=>v.a>0).length;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${done}</b><small>已练题数</small></div>
    <div class="stat"><b>${attempts?Math.round(correct/attempts*100):0}%</b><small>答对率</small></div>
    <div class="stat"><b>${wrongN}</b><small>待攻克错题</small></div>`;
}

/* ---------------- home ---------------- */
UI.home = function(){
  document.getElementById("mainPane").hidden = true;
  document.getElementById("homePane").hidden = false;
  renderStats();
  const b = bankList();
  const done = b.filter(q => (store.db[qId(q)]||{}).a).length;
  document.querySelector("#homePane h2.s").textContent =
    `开始刷题 · 当前题库：${TYPE_LABEL[curBank]}（已练 ${done}/${b.length}）`;
  document.querySelector("#homePane").scrollIntoView({block:"nearest"});
};

/* ---------------- helpers ---------------- */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pane(){ return document.getElementById("mainPane"); }
function showMain(html){
  document.getElementById("homePane").hidden = true;
  const p = pane(); p.hidden = false; p.innerHTML = html;
  window.scrollTo({top:0, behavior:"smooth"});
}
function normalize(s){
  return String(s).toLowerCase().replace(/[\s，,。.、；;：:！!？?“”"'‘’（）()《》〈〉\-—]/g,"");
}

/* ---------------- study engine ---------------- */
const Study = {
  mode:null, queue:[], pos:0, picked:[], revealed:false,

  start(mode, resume){
    const list = bankList();
    let qs = list.slice();
    if(mode === "wrong"){
      qs = qs.filter(q => { const r = store.db[qId(q)]; return r && r.w>0 && !r.master; });
      if(!qs.length){ showMain(`<div class="empty">🎉 这个题库暂时没有待攻克的错题<br><br>
        <button class="btn primary" onclick="UI.home()">返回</button></div>`); return; }
    }
    if(mode === "random") qs = shuffle(qs);
    this.mode = mode;
    this.queue = qs;
    this.pos = 0;
    if(resume && mode === "order"){
      this.pos = Math.min(Math.max(0, store.cursor[curBank] || 0), qs.length-1);
    }
    this.render();
  },

  render(){
    if(!this.queue.length){ showMain(`<div class="empty">暂无题目</div>`); return; }
    if(this.pos >= this.queue.length){
      const total = this.queue.length;
      const answered = this.queue.filter(q => store.db[qId(q)] && store.db[qId(q)].a).length;
      showMain(`<div class="panel">
        <h2 class="s">🎉 本轮完成</h2>
        <p class="hint">共 ${total} 题，本浏览器累计作答 ${answered} 题。错题已自动进入错题本。</p>
        <div class="toolbar" style="margin-top:12px">
          <button class="btn primary" onclick="Study.start('${this.mode}')">再来一轮</button>
          <button class="btn" onclick="Study.start('wrong')">只刷错题</button>
          <button class="btn ghost" onclick="UI.home()">返回首页</button>
        </div></div>`);
      return;
    }
    if(this.mode === "order"){ store.cursor[curBank] = this.pos; persist(); }
    const q = this.queue[this.pos];
    const id = qId(q);
    const r = rec(id);
    // reset the working state only when the question actually changes
    if(this._current !== id){
      this._current = id;
      this.picked = [];
      this.revealed = !!store.unlocked[id];
      this.judged = false;
    }
    const isFill = q.t === "fill";
    const noKey = !q.a || (Array.isArray(q.a) && !q.a.length);
    const stemHtml = isFill
      ? fmtFill(q, this.revealed)
      : esc(q.q).replace(/_{2,}/g, '<em>＿＿</em>');

    let body = "";
    if(isFill){
      // the fill-in stem doubles as the answer card, so it is not repeated above
      body = `
        <div class="answerbox" id="fillBox">${stemHtml}</div>
        ${this.revealed
          ? `<div class="verdict ok" style="border-color:var(--line);background:var(--bg);color:var(--ink)">
               <span class="k">参考答案</span>
               <div style="margin-top:6px">${q.a.map((x,i)=>`<div>${q.a.length>1?`(${i+1})`:""} ${esc(x)}</div>`).join("")}</div>
             </div>`
          : `<p class="hint">先在心里（或纸上）填好答案，再点“查看答案”对照。</p>`}
        <div class="toolbar" style="margin-top:6px">
          ${this.revealed ? "" : `<button class="btn primary" onclick="Study.reveal()">查看答案</button>`}
          ${this.revealed ? `
            <button class="btn gold" onclick="Study.selfJudge(true)">✅ 我答对了</button>
            <button class="btn" style="border-color:var(--bad);color:var(--bad)" onclick="Study.selfJudge(false)">❌ 我答错了</button>` : ""}
        </div>`;
    }else{
      const opts = q.o.map((o,i)=>{
        const letter = "ABCD"[i];
        let cls = "";
        if(this.revealed && !noKey){
          if(q.a.includes(letter)) cls = "good";
          else if(this.picked.includes(letter)) cls = "bad";
        }else if(this.revealed && noKey){
          if(this.picked.includes(letter)) cls = "sel";
        }else if(this.picked.includes(letter)) cls = "sel";
        const locked = this.revealed || this.judged;
        return `<button class="opt ${cls}" ${locked?"disabled":""} onclick="Study.pick('${letter}')">
          ${q.t==="judge" ? "" : `<span class="k">${letter}</span>`}${esc(o)}</button>`;
      }).join("");
      body = `<div id="opts">${opts}</div>${this.revealed ? this.feedback(q) : ""}
        <div class="toolbar" style="margin-top:8px">
          ${this.revealed ? "" : `<button class="btn primary" onclick="Study.submit()">提交答案</button>`}
        </div>`;
    }

    showMain(`<div class="panel">
      <div class="qmeta">
        <span class="chip">${TYPE_LABEL[q.t]} · 第 ${q.n} 题</span>
        <span class="chip">${this.pos+1} / ${this.queue.length}</span>
      </div>
      ${isFill ? "" : `<div class="qtext">${stemHtml}</div>`}
      ${body}
      <div class="navrow">
        <button class="btn" onclick="Study.go(-1)" ${this.pos?"":"disabled"}>← 上一题</button>
        <button class="btn" onclick="Study.go(1)">下一题 →</button>
        <span class="grow"></span>
        <span class="chip">累计错 ${r.w} 次${r.master?" · 已掌握":""}</span>
      </div>
      <div class="jump">
        <span>跳到第</span>
        <input id="jumpInput" type="number" min="1" max="${this.queue.length}" value="${this.pos+1}" inputmode="numeric">
        <span>题</span>
        <button class="btn" onclick="Study.jump()">跳转</button>
        <button class="btn ghost" onclick="UI.home()">退出</button>
      </div>
    </div>`);
  },

  go(d){
    this._current = null;                 // force a clean slate for the next question
    this.pos = Math.min(Math.max(0, this.pos + d), this.queue.length);
    this.render();
  },
  jump(){
    const v = Number(document.getElementById("jumpInput").value);
    if(!Number.isInteger(v) || v < 1 || v > this.queue.length){ alert("请输入 1 ~ " + this.queue.length); return; }
    this._current = null;
    this.pos = v - 1; this.render();
  },
  pick(letter){
    const q = this.queue[this.pos];
    if(q.t === "multi"){
      this.picked = this.picked.includes(letter)
        ? this.picked.filter(x => x !== letter) : [...this.picked, letter].sort();
    }else{
      this.picked = [letter];
    }
    // re-render only the options block
    const box = document.getElementById("opts");
    box.innerHTML = q.o.map((o,i)=>{
      const L = "ABCD"[i];
      return `<button class="opt ${this.picked.includes(L)?"sel":""}" onclick="Study.pick('${L}')">
        ${q.t==="judge" ? "" : `<span class="k">${L}</span>`}${esc(o)}</button>`;
    }).join("");
  },
  submit(){
    const q = this.queue[this.pos];
    if(!this.picked.length){ alert("请先选择答案"); return; }
    const noKey = !q.a || (Array.isArray(q.a) && !q.a.length) || q.t === "quiz";
    if(noKey){
      // practice items carry no answer key in the source material: ask for self-assessment
      this.revealed = true;
      this.render();
      return;
    }
    const correct = this.picked.slice().sort().join("") === q.a.split("").sort().join("");
    this.answer(q, correct);
  },
  reveal(){
    const q = this.queue[this.pos];
    store.unlocked[qId(q)] = true; persist();
    this.revealed = true;
    this.render();
  },
  selfJudge(ok){
    const q = this.queue[this.pos];
    this.answer(q, ok);
  },
  answer(q, correct){
    const r = rec(qId(q));
    r.a += 1;
    if(correct){
      r.c += 1;
      if(r.w > 0) r.master = true;
    }else{
      r.w += 1; r.master = false;
    }
    r.last = this.picked.join("");
    persist();
    this.revealed = true;
    this.judged = true;
    this.render();
  },
  feedback(q){
    const noKey = !q.a || (Array.isArray(q.a) && !q.a.length) || q.t === "quiz";
    const avg = rec(qId(q));
    if(noKey){
      return `<div class="verdict ok" style="border-color:var(--line);background:var(--bg);color:var(--ink)">
        <span class="k" style="color:var(--gold)">原题库未提供本题答案</span>
        <div style="margin-top:5px">你选择了 <b>${this.picked.join("、") || "（未选）"}</b>。请对照党校教材确认后自评，自评结果会记入错题本。</div>
        <div class="toolbar" style="margin-top:9px">
          <button class="btn gold" onclick="Study.selfJudge(true)">✅ 我答对了</button>
          <button class="btn" style="border-color:var(--bad);color:var(--bad)" onclick="Study.selfJudge(false)">❌ 我答错了</button>
        </div></div>`;
    }
    const correct = this.picked.slice().sort().join("") === q.a.split("").sort().join("");
    return `<div class="verdict ${correct?"ok":"bad"}">
      <span class="k">${correct?"✓ 回答正确":"✗ 回答错误"}</span>
      <div style="margin-top:5px">正确答案：<b>${q.a.split("").join("、")}</b>
      ${q.t==="multi"?`<br><span>多选题需全部选对才计为正确，少选、多选均不给分。</span>`:""}</div>
      <div style="margin-top:5px;font-size:13px;opacity:.85">
        ${avg.w ? `本题累计答错 ${avg.w} 次。` : ""}${avg.master?" 已标记为掌握，仍保留错误记录。":""}
      </div></div>`;
  },
  next(){ this.go(1); }
};

function fmtFill(q, show){
  const answers = q.a;
  const RE = /（\s*　?\s*）|_{2,}|＿＿|（_+）/g;
  // When hidden the answer text is kept out of the DOM entirely (no peeking in devtools);
  // the blank is sized from the answer length instead.
  const blank = a => show
    ? `<span class="blank">${esc(a)}</span>`
    : `<span class="blank hide" style="min-width:${Math.min(9, Math.max(3, String(a).length))}em"></span>`;
  let i = 0;
  let out = esc(q.q).replace(RE, () => {
    const a = answers[i++] || "";
    return blank(a);
  });
  // The source PDF dropped the original blank markers (they were spaces) for most
  // items, so these get a numbered blank row instead of an invented insertion point.
  if(i === 0){
    const marks = "①②③④⑤⑥";
    out += `<div class="blankrow">` + answers.map((a, k) =>
      `<span class="blankitem">${marks[k] || k+1}${blank(a)}</span>`).join("") + `</div>`;
  }
  return out;
}

/* ---------------- exam ---------------- */
const Exam = {
  list:[], pos:0, picked:[], done:false,
  begin(){
    const pool = KEYS.filter(k => k !== "quiz" && (BANKS[k]||[]).length)
      .flatMap(k => BANKS[k].map(q => ({q, k})));
    this.list = shuffle(pool).slice(0, 30);
    this.pos = 0; this.picked = []; this.done = false;
    this.render();
  },
  render(){
    if(!this.list.length){ UI.home(); return; }
    if(this.pos >= this.list.length) return this.result();
    const {q} = this.list[this.pos];
    const isFill = q.t === "fill";
    const stem = isFill ? fmtFill(q, false) : esc(q.q).replace(/_{2,}/g, '<em>＿＿</em>');
    const body = isFill
      ? `<p class="hint">填空题：考试模式下不自动评分，答完请自行对照，或在最后查看参考答案。</p>`
      : `<div id="opts">${q.o.map((o,i)=>{
          const L = "ABCD"[i];
          return `<button class="opt ${this.picked.includes(L)?"sel":""}" onclick="Exam.pick('${L}')">
            ${q.t==="judge" ? "" : `<span class="k">${L}</span>`}${esc(o)}</button>`;
        }).join("")}</div>`;
    showMain(`<div class="panel">
      <div class="qmeta">
        <span class="chip">模拟考试 · ${TYPE_SHORT[q.t]}</span>
        <span class="chip">${this.pos+1} / ${this.list.length}</span>
      </div>
      <div class="qtext">${stem}</div>
      ${body}
      <div class="navrow">
        <button class="btn" onclick="Exam.go(-1)" ${this.pos?"":"disabled"}>← 上一题</button>
        <button class="btn primary" onclick="Exam.go(1)">${this.pos===this.list.length-1?"交卷 →":"下一题 →"}</button>
        <span class="grow"></span>
        <button class="btn ghost" onclick="if(confirm('确定退出考试？'))UI.home()">退出</button>
      </div>
    </div>`);
  },
  pick(L){
    const {q} = this.list[this.pos];
    if(q.t === "multi"){
      this.picked = this.picked.includes(L) ? this.picked.filter(x=>x!==L) : [...this.picked,L].sort();
    }else this.picked = [L];
    this.render();
  },
  go(d){
    this.list[this.pos].picked = this.picked.slice();
    this.pos += d;
    if(this.pos >= this.list.length) return this.result();
    this.picked = (this.list[this.pos].picked || []).slice();
    this.render();
  },
  result(){
    let right = 0, gradable = 0, fillN = 0, noKeyN = 0;
    const rows = this.list.map(({q}, idx) => {
      const isFill = q.t === "fill";
      const hasKey = !isFill && q.a && q.a.length;
      const sel = ((this.list[idx] && this.list[idx].picked) || []).join("");
      const id = qId(q);
      const r = rec(id);
      let ok = null;
      if(hasKey){
        gradable++;
        ok = sel.split("").sort().join("") === String(q.a).split("").sort().join("");
        if(ok) right++;
        r.a++; if(ok){ r.c++; if(r.w>0) r.master = true; } else { r.w++; r.master = false; }
        r.last = sel;
      }else if(isFill){ fillN++; } else { noKeyN++; }
      return `<div class="rowitem">
        <div class="t">${TYPE_SHORT[q.t]} ${q.n}. ${esc(q.q).slice(0,90)}${q.q.length>90?"…":""}</div>
        <div class="meta">
          ${isFill
            ? `<span class="pill">参考：${esc(q.a.join("；"))}</span>`
            : hasKey
              ? `<span class="pill ${ok?"ok":""}">${sel||"未作答"} ${ok?"✓":"✗"}　正确：${q.a.split("").join("、")}</span>`
              : `<span class="pill">无标准答案 · 你选了 ${sel||"未答"}</span>`}
        </div></div>`;
    }).join("");
    persist();
    const score = gradable ? Math.round(right/gradable*100) : 0;
    showMain(`<div class="panel">
      <h2 class="s">📝 考试结果</h2>
      <div class="stats">
        <div class="stat"><b>${right}/${gradable}</b><small>选择/判断得分</small></div>
        <div class="stat"><b>${score}%</b><small>正确率</small></div>
        <div class="stat"><b>${fillN + noKeyN}</b><small>自评题</small></div>
      </div>
      <p class="hint" style="margin-top:10px">选择题与判断题已自动批改并计入学习记录；填空题与无标准答案题请对照下方参考答案自行评估。</p>
      <div class="divider"></div>
      ${rows}
      <div class="toolbar" style="margin-top:14px">
        <button class="btn primary" onclick="Exam.begin()">再来一次</button>
        <button class="btn" onclick="UI.wrongBook()">查看错题本</button>
        <button class="btn ghost" onclick="UI.home()">返回首页</button>
      </div>
    </div>`);
  }
};
// capture picks before leaving each question
const _examPick = Exam.pick;
Exam.pick = function(L){ _examPick.call(this, L); this.list[this.pos].picked = this.picked.slice(); };
const _examGo = Exam.go;
Exam.go = function(d){ this.list[this.pos].picked = this.picked.slice(); _examGo.call(this, d); };

/* ---------------- wrong book / data ---------------- */
UI.wrongBook = function(){
  const rows = [];
  for(const k of KEYS){
    for(const q of (BANKS[k]||[])){
      const r = store.db[qId(q)];
      if(r && r.w > 0) rows.push({q, r});
    }
  }
  rows.sort((a,b)=> (b.r.master?0:1)-(a.r.master?0:1) || b.r.w-a.r.w);
  if(!rows.length){
    showMain(`<div class="panel"><h2 class="s">📕 错题本</h2>
      <div class="empty">还没有错题记录<br>去刷题吧，做错的题会自动收进来</div>
      <button class="btn primary" onclick="UI.home()">返回首页</button></div>`);
    return;
  }
  const byType = {};
  rows.forEach(x => (byType[x.q.t] = byType[x.q.t] || []).push(x));
  let html = `<div class="panel"><h2 class="s">📕 错题本 · 共 ${rows.length} 题</h2>
    <div class="sel-wrap">${Object.keys(byType).map(k=>`<span class="chip">${TYPE_SHORT[k]} ${byType[k].length}</span>`).join("")}</div>
    <div class="divider"></div>`;
  for(const k of Object.keys(byType)){
    html += `<h2 class="s" style="margin-top:12px">${TYPE_LABEL[k]}</h2>`;
    html += byType[k].map(({q,r}) => `<div class="rowitem">
      <div class="t">${q.n}. ${esc(q.q).slice(0,120)}${q.q.length>120?"…":""}</div>
      <div class="meta">
        <span class="pill">错 ${r.w} 次</span>
        <span class="pill ${r.master?"ok":""}">${r.master?"已掌握":"待攻克"}</span>
        ${q.t==="fill" ? `<span class="pill">参考：${esc(q.a.join("；"))}</span>`
          : q.a && q.a.length ? `<span class="pill">正确：${q.a.split("").join("、")}</span>`
          : `<span class="pill">无标准答案</span>`}
        <button class="btn" style="padding:4px 10px;font-size:13px" onclick="Study.reviewOne('${qId(q)}')">重做</button>
      </div></div>`).join("");
  }
  html += `<div class="toolbar" style="margin-top:14px">
      <button class="btn" onclick="UI.exportData()">导出记录</button>
      <button class="btn ghost" onclick="UI.home()">返回首页</button></div></div>`;
  showMain(html);
};

Study.reviewOne = function(id){
  const q = byId(id);
  if(!q) return;
  curBank = q.t;
  renderTabs();
  this.mode = "single-review";
  this.queue = [q];
  this.pos = 0;
  this.render();
};

UI.exportData = function(){
  const payload = {app:"Rudang-Quiz", version:1, exportedAt:new Date().toISOString(), data:store};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "入党积极分子刷题记录_" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
};

UI.resetAll = function(){
  if(!confirm("确定清空本浏览器里的全部练习记录？此操作不可撤销。")) return;
  store.db = {}; store.cursor = {}; store.unlocked = {};
  persist(); renderStats(); UI.home();
};

document.getElementById("importFile").addEventListener("change", function(e){
  const f = e.target.files[0];
  if(!f) return;
  f.text().then(t=>{
    try{
      const o = JSON.parse(t);
      const d = o && o.data && o.data.db ? o.data : (o && o.db ? o : null);
      if(!d || typeof d.db !== "object") throw new Error("bad");
      store.db = d.db || {};
      store.cursor = d.cursor || {};
      store.unlocked = d.unlocked || {};
      persist(); renderStats(); UI.home();
      alert("导入成功：" + Object.keys(store.db).length + " 条记录");
    }catch(err){ alert("文件格式不正确"); }
  });
  e.target.value = "";
});

/* ---------------- theme ---------------- */
function applyTheme(){
  const night = store.theme === "night";
  document.body.classList.toggle("night", night);
  document.documentElement.style.colorScheme = night ? "dark" : "light";
  const btn = document.getElementById("themeBtn");
  if(btn) btn.textContent = night ? "☀️ 日间" : "🌙 夜间";
}
function toggleTheme(){
  store.theme = store.theme === "night" ? "day" : "night";
  persist();
  applyTheme();
}

/* ---------------- boot ---------------- */
document.addEventListener("keydown", e=>{
  if(e.key === "ArrowRight"){ if(pane().hidden === false && Study.queue.length) Study.go(1); }
  if(e.key === "ArrowLeft"){ if(pane().hidden === false && Study.queue.length) Study.go(-1); }
});
applyTheme();
renderTabs();
UI.home();
</script>
